name: Build TWRP recovery (RM330)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - 'build.sh'
      - '.github/workflows/build-twrp.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk python3 python-is-python3 git curl \
            bc bison build-essential ccache flex g++-multilib gcc-multilib gnupg \
            gperf imagemagick lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          # AOSP 10 prebuilts on 22.04 may still need OpenSSL 1.1 / ncurses 5
          echo "deb http://archive.ubuntu.com/ubuntu focal main universe" \
            | sudo tee /etc/apt/sources.list.d/focal-compat.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl1.1 libncurses5 libtinfo5 || true
          sudo rm -f /etc/apt/sources.list.d/focal-compat.list
          sudo apt-get update
          java -version
          df -h /

      - name: Repo init and sync
        run: |
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@localhost"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod +x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          mkdir -p "$HOME/twrp10"
          cd "$HOME/twrp10"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-10.0-deprecated --depth=1
          repo sync -j4 --force-sync --no-clone-bundle
          du -sh .repo .
          df -h /
          echo "--- project presence ---"
          for p in test/vts system/bpf external/junit external/hamcrest external/guava external/curl frameworks/opt/telephony prebuilts/misc; do
            if [ -d "$p" ]; then echo "PRESENT $p"; else echo "MISSING $p"; fi
          done
          echo "project_count=$(repo list 2>/dev/null | wc -l)"
          repo list 2>/dev/null | grep -E 'system/bpf|external/junit|external/guava|frameworks/opt/telephony' || true

      - name: Build recoveryimage
        run: |
          cd "$HOME/twrp10"
          mkdir -p device/dji
          cp -r "$GITHUB_WORKSPACE/device/dji/rm330" device/dji/rm330
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_rm330-eng
          mka recoveryimage -j4
          ls -l out/target/product/rm330/recovery.img
          cp out/target/product/rm330/recovery.img "$GITHUB_WORKSPACE/recovery-rm330.img"
          df -h /

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-rm330
          path: recovery-rm330.img
          if-no-files-found: error
